name: Build e Release do APK Android

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão personalizada (ex: 1.1.0). Deixe vazio para gerar automaticamente."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Preparar Android SDK pré-instalado e aceitar licenças
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK não encontrado em $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          mkdir -p "${SDK_DIR}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "${SDK_DIR}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "${SDK_DIR}/licenses/android-sdk-preview-license"
          SDKMANAGER="$(find "${SDK_DIR}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Calcular versão e build incremental
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((100 + RUN_NUMBER))
          if [ -n "$INPUT_VERSION" ]; then
            VERSION_NAME="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION_NAME="${REF_NAME#v}"
          else
            VERSION_NAME="1.0.${RUN_NUMBER}"
          fi
          TAG_NAME="v${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências do projeto
        run: npm install --legacy-peer-deps

      - name: Gerar build web com metadados de versão
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
          VITE_APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VITE_API_BASE_URL: ${{ vars.APP_API_URL }}
          VITE_DEFAULT_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Preparar projeto Android com Capacitor
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decodificar keystore de assinatura permanente (se configurada)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/oratorio-release.keystore"
            printf "%s" "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "keystore_path=${KEYSTORE_FILE}" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "signing_label=Ativa (Release Assinado)" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "signing_label=Debug temporario (configure os secrets ANDROID_KEYSTORE_* para atualizar sem desinstalar)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar versionCode, versionName e assinatura no Gradle
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ORATORIO_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: node scripts/prepare-android-gradle.mjs

      - name: Compilar APK Android
        id: build_apk
        env:
          ORATORIO_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ORATORIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORATORIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORATORIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          chmod +x android/gradlew
          mkdir -p release-output
          if [ "$IS_SIGNED" = "true" ]; then
            (cd android && ./gradlew assembleRelease --no-daemon)
            APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
            APK_DEST="release-output/oratorio-v${VERSION_NAME}-release.apk"
          else
            (cd android && ./gradlew assembleDebug --no-daemon)
            APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
            APK_DEST="release-output/oratorio-v${VERSION_NAME}-debug.apk"
          fi
          cp "$APK_SRC" "$APK_DEST"
          cp "$APK_SRC" "release-output/oratorio-latest.apk"
          echo "apk_path=${APK_DEST}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$(basename "$APK_DEST")" >> "$GITHUB_OUTPUT"

      - name: Limpar keystore temporária
        if: always()
        run: rm -f "${RUNNER_TEMP}/oratorio-release.keystore"

      - name: Gerar manifesto version.json para o atualizador interno
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_FILENAME: ${{ steps.build_apk.outputs.apk_filename }}
          IS_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          cat <<EOF > release-output/version.json
          {
            "appId": "com.oratorio.app",
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkFilename": "${APK_FILENAME}",
            "signedRelease": ${IS_SIGNED},
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Disponibilizar APK como artefato da Action
        uses: actions/upload-artifact@v4
        with:
          name: oratorio-apk-v${{ steps.version.outputs.version_name }}
          path: |
            ${{ steps.build_apk.outputs.apk_path }}
            release-output/oratorio-latest.apk
            release-output/version.json

      - name: Publicar GitHub Release com download direto do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Oratório v${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})
          generate_release_notes: true
          make_latest: true
          body: |
            ### Download do APK — Oratório v${{ steps.version.outputs.version_name }}

            - **Pacote Android (`applicationId`):** `com.oratorio.app`
            - **Build (`versionCode`):** `${{ steps.version.outputs.version_code }}`
            - **Assinatura permanente (atualização sem desinstalar):** ${{ steps.signing.outputs.signing_label }}
            - **Link direto sempre atualizado:** `oratorio-latest.apk`
          files: |
            ${{ steps.build_apk.outputs.apk_path }}
            release-output/oratorio-latest.apk
            release-output/version.json
